appId: "com.aurafit.app"
---
- launchApp
- tapOn: "Misafir Olarak Devam Et"
- tapOn:
    id: "quick-play-btn"
- tapOn: "PAZARTESİ.*"
- tapOn:
    id: "set-complete-btn-mobile-0-0"
- tapOn:
    id: "skip-rest-btn-mobile"
- tapOn: "Antrenmanı Bitir"
- runFlow:
    when:
      visible: "Kaydet ve Devam Et"
    commands:
      - tapOn: "Kaydet ve Devam Et"
- assertVisible: "Hoş Geldin.*"
