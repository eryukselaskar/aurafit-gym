<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraFit - Giriş Yardımcısı</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(13, 15, 23, 0.75);
      --border-color: rgba(139, 92, 246, 0.2);
      --accent-violet: #8b5cf6;
      --accent-pink: #ec4899;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at center, rgba(139, 92, 246, 0.12) 0%, var(--bg-dark) 70%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.1);
      backdrop-filter: blur(10px);
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo-glow {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(139, 92, 246, 0.25);
      margin: 0 auto;
    }

    .logo-svg {
      color: var(--accent-violet);
      filter: drop-shadow(0 0 8px var(--accent-violet));
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, var(--accent-violet) 0%, var(--accent-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-violet) 0%, var(--accent-pink) 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
    }

    .btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .manual-code-container {
      display: none;
      margin-top: 20px;
      text-align: left;
    }

    .code-textarea {
      width: 100%;
      height: 90px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      resize: none;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo-glow">
        <svg class="logo-svg" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
      </div>
    </div>
    <h1>AuraFit Giriş</h1>
    <p id="status-text">Güvenli Google oturumu açmak için aşağıdaki butona tıklayın.</p>
    <button id="login-btn" class="btn">
      <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#ffffff"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#ffffff" fillOpacity="0.85"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#ffffff" fillOpacity="0.75"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 6.54l3.66 2.83c.87-2.6 3.3-4.53 6.16-4.53z" fill="#ffffff" fillOpacity="0.95"/>
      </svg>
      Google ile Giriş Yap
    </button>

    <div id="manual-container" class="manual-code-container">
      <textarea id="manual-code-area" class="code-textarea" readonly></textarea>
      <button id="copy-btn" class="btn">Kodu Kopyala</button>
    </div>
  </div>

  <!-- Firebase Legacy/Compat SDKs for easy HTML integration -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB1NvMP8OUsTejg_p8WkRpCsgeKE0Kz6gU",
      authDomain: "aurafit-app-2026.firebaseapp.com",
      projectId: "aurafit-app-2026",
      storageBucket: "aurafit-app-2026.firebasestorage.app",
      messagingSenderId: "586826078940",
      appId: "1:586826078940:web:42ca79d267f1bc5b977219"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const port = urlParams.get('port');
    const state = urlParams.get('state');

    const loginBtn = document.getElementById('login-btn');
    const statusText = document.getElementById('status-text');

    loginBtn.addEventListener('click', () => {
      loginBtn.disabled = true;
      statusText.innerText = "Lütfen açılan Google penceresinde oturum açın...";
      
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          statusText.innerText = "Giriş başarılı! Kimlik doğrulanıyor...";
          
          // Retrieve the Google OAuth ID Token safely
          const credential = result.credential || firebase.auth.GoogleAuthProvider.credentialFromResult(result);
          if (!credential) {
            statusText.innerText = "Hata: Google kimlik bilgisi alınamadı.";
            loginBtn.disabled = false;
            return;
          }
          const idToken = credential.idToken;
          const user = result.user;
          
          // Post authorization parameters back to the Electron app (same origin as page)
          fetch(`http://localhost:${port}/api/auth-callback`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              state: state,
              uid: user.uid,
              email: user.email,
              displayName: user.displayName,
              photoURL: user.photoURL,
              idToken: idToken
            })
          })
          .then(res => {
            if (res.ok) {
              statusText.innerText = "Doğrulama başarılı! Bu sekmeyi kapatıp AuraFit uygulamasına dönebilirsiniz.";
              loginBtn.style.display = 'none';
            } else {
              showManualFallback(user, idToken, "Güvenlik anahtarı (state) eşleşmedi.");
            }
          })
          .catch(err => {
            showManualFallback(user, idToken, "Uygulamaya otomatik bağlanılamadı.");
          });
        })
        .catch((error) => {
          statusText.innerText = "Giriş yapılamadı: " + error.message;
          loginBtn.disabled = false;
        });
    });

    function showManualFallback(user, idToken, reason) {
      statusText.innerText = reason + " Lütfen aşağıdaki kodu kopyalayıp uygulamadaki manuel giriş alanına yapıştırın:";
      loginBtn.style.display = 'none';
      
      const manualContainer = document.getElementById('manual-container');
      const manualCodeArea = document.getElementById('manual-code-area');
      manualContainer.style.display = 'block';
      
      const payload = {
        uid: user.uid,
        email: user.email,
        displayName: user.displayName,
        photoURL: user.photoURL,
        idToken: idToken
      };
      
      // Unicode safe Base64 encoding
      manualCodeArea.value = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
      const codeArea = document.getElementById('manual-code-area');
      codeArea.select();
      document.execCommand('copy');
      const copyBtn = document.getElementById('copy-btn');
      copyBtn.innerText = "Kopyalandı!";
      setTimeout(() => {
        copyBtn.innerText = "Kodu Kopyala";
      }, 2000);
    });
  </script>
</body>
</html>
